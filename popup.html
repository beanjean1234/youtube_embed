<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- 프리미엄 백그라운드 효과 -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="app">
        <!-- 헤더 -->
        <header class="header">
            <div class="logo-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M21.5 7.5C21.5 7.5 21.3 6.1 20.7 5.5C19.9 4.7 19.0 4.7 18.6 4.6C16.0 4.4 12.0 4.4 12.0 4.4C12.0 4.4 8.0 4.4 5.4 4.6C5.0 4.7 4.1 4.7 3.3 5.5C2.7 6.1 2.5 7.5 2.5 7.5C2.5 7.5 2.3 9.1 2.3 10.7V13.3C2.3 14.9 2.5 16.5 2.5 16.5C2.5 16.5 2.7 17.9 3.3 18.5C4.1 19.3 5.1 19.3 5.6 19.4C7.1 19.5 12.0 19.6 12.0 19.6C12.0 19.6 16.0 19.6 18.6 19.4C19.0 19.3 19.9 19.3 20.7 18.5C21.3 17.9 21.5 16.5 21.5 16.5C21.5 16.5 21.7 14.9 21.7 13.3V10.7C21.7 9.1 21.5 7.5 21.5 7.5ZM9.8 14.8V9.2L15.3 12.0L9.8 14.8Z" fill="#FF2A5F"/>
                </svg>
            </div>
            <h1 class="brand-title">YT Memory</h1>
        </header>

        <!-- 현재 영상 저장 섹션 -->
        <section class="card glass-panel">
            <div class="card-header">
                <h2 class="card-title">현재 영상 저장</h2>
            </div>
            <button id="saveBtn" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                </svg>
                <span>스크립트 추출 &amp; 자율 분석</span>
            </button>
        </section>

        <!-- 검색 섹션 -->
        <section class="card glass-panel">
            <div class="card-header">
                <h2 class="card-title">영상 내용 검색</h2>
            </div>
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="기억나는 내용이나 대사를 입력..." autocomplete="off" />
                <div class="search-actions">
                    <button id="clearBtn" class="btn-clear" aria-label="지우기" style="display:none;">✕</button>
                    <button id="searchBtn" class="btn-search-icon" aria-label="검색">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="results" class="results-container"></div>
        </section>

        <!-- 저장된 영상 목록 섹션 -->
        <section class="card glass-panel">
            <div class="card-header list-toggle-header" id="listBtn">
                <div class="title-with-badge">
                    <h2 class="card-title mb-0">저장된 영상 모음</h2>
                    <span id="videoCount" class="badge-count" style="display:none">0</span>
                </div>
                <svg id="listChevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="chevron-icon">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </div>
            <div id="videoListWrap" class="video-list-wrap collapsed">
                <div id="videoList" class="video-list"></div>
                <button id="clearAllBtn" class="btn btn-danger" style="display:none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    <span>전체 삭제</span>
                </button>
            </div>
        </section>
        
        <!-- 상태 표시 알림창 (Toast) -->
        <div id="status" class="status"></div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
