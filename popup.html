<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extension UI</title>
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <!-- 상단 -->
        <div class="top-bar">
            <div class="search-box">
                <span class="material-icons">search</span>
                <input id="searchInput" type="text" placeholder="검색어를 입력하세요"
                    data-i18n-placeholder="placeholderSearch" />
                <span id="clearSearchBtn" class="material-icons search-clear" style="display:none;">close</span>
            </div>
            <button id="settingsToggleBtn" class="icon-btn" title="설정" data-i18n-title="titleSettings">
                <span class="material-icons">settings</span>
            </button>
            <button id="docsBtn" class="icon-btn" title="저장된 영상 목록" data-i18n-title="titleSavedMemory">
                <span class="material-icons">article</span>
            </button>
        </div>

        <!-- 뷰포트 (슬라이드 애니메이션용) -->
        <div class="viewport">
            <div id="pageWrapper" class="page-wrapper">

                <!-- 1. 설정 페이지 -->
                <div class="page settings-page">
                    <div class="page-header">
                        <button id="backToMainFromSettings" class="icon-btn">
                            <span class="material-icons">arrow_back</span>
                        </button>
                        <h2 data-i18n="titleSettings">설정</h2>
                    </div>
                    <div class="page-content">
                        <div class="field-group">
                            <label class="field-label" for="languageSelect" data-i18n="labelLanguage">언어
                                (Language)</label>
                            <div class="select-wrapper">
                                <select id="languageSelect" class="custom-select">
                                    <option value="auto" data-i18n="optAuto">자동 감지 (Auto)</option>
                                    <option value="en">English</option>
                                    <option value="ko">한국어 (Korean)</option>
                                </select>
                            </div>
                        </div>
                        <div class="field-group">
                            <div class="field-label-row">
                                <label class="field-label" for="apiKeyInput" data-i18n="labelApiKey">Gemini API
                                    Key</label>
                                <a href="https://aistudio.google.com/api-keys" target="_blank" class="field-link"
                                    data-i18n="linkGetApiKey">API key 발급</a>
                            </div>
                            <div class="api-key-wrapper">
                                <input id="apiKeyInput" type="password" class="api-key-input" placeholder="AIza..." />
                                <button id="toggleKeyVisBtn" class="text-btn">
                                    <span id="eyeIcon" class="material-icons">visibility_off</span>
                                </button>
                            </div>
                        </div>
                        <button id="saveSettingsBtn" class="btn-primary-action">
                            <span data-i18n="btnSaveSettings">설정 저장</span>
                        </button>
                    </div>
                </div>

                <!-- 2. 메인 페이지 (검색 & 초기상태) -->
                <div class="page main-page">
                    <div id="mainEmptyState" class="main">
                        <div class="illustration">
                            <span class="material-icons big">description</span>
                            <span class="material-icons overlay">search</span>
                        </div>
                        <h2 data-i18n="titleSearch">원하는 영상을 검색해보세요</h2>
                        <p data-i18n="descSearch">
                            영상에서 기억나는 부분을 검색하거나<br />
                            영상의 주제 등을 검색해보세요.
                        </p>
                    </div>
                    <div id="results" class="results-container" style="display: none;"></div>
                </div>

                <!-- 3. 목록 페이지 -->
                <div class="page list-page">
                    <div class="page-header">
                        <button id="backToMainFromList" class="icon-btn">
                            <span class="material-icons">arrow_back</span>
                        </button>
                        <h2 data-i18n="titleSavedMemory">저장된 기록</h2>
                        <button id="clearAllBtn" class="icon-btn danger text-btn-flex">
                            <span class="material-icons">delete_sweep</span>
                            <span data-i18n="btnClearAll">전체 삭제</span>
                        </button>
                    </div>
                    <div class="page-content">
                        <div id="videoList" class="video-list-full"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 하단 고정 스크립트 추출 버튼 -->
        <button id="saveBtn" class="bottom-action-btn" data-i18n="btnExtract">영상 내용 추출</button>
    </div>
    <div id="statusMessage" class="status"></div>
    <script src="popup.js"></script>
</body>

</html>
